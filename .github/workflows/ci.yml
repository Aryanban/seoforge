name: CI — Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (engine)
        run: npm run typecheck

      - name: Typecheck (web)
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (engine + web)
        run: npm run build

      - name: Verify CLI boots
        run: node dist/cli.js --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: seoforge-dist
          path: dist/
          retention-days: 7
