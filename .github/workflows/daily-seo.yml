name: Daily SEO & AEO Autopilot

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run SEOForge Daily Routine
        run: npm run daily

      - name: Upload Daily Health Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-seo-report
          path: reports/*.md
          retention-days: 30
